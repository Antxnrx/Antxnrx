<style>
  * { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .title { font-size: 26px; font-weight: 700; fill: #1d1d1f; }
  .subtitle { font-size: 15px; font-weight: 500; fill: #86868b; }
  .stat-value { font-size: 36px; font-weight: 700; fill: #007AFF; }
