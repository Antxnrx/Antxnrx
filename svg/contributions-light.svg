  .chart-line { fill: none; stroke: #007AFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart-fill { fill: #007AFF; opacity: 0.15; }
  .tooltip-bg { fill: #1d1d1f; opacity: 0.9; }
  .tooltip-text { fill: #ffffff; font-size: 11px; font-weight: 600; }
</style>

